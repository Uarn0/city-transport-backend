name: .NET CI & Tests

# На яких етапах запускати перевірку
on:
  push:
    branches: [ "main", "master", "dev" ] # Вкажіть ваші основні гілки
  pull_request:
    branches: [ "main", "master", "dev" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Підіймаємо чисту базу PostgreSQL для виконання інтеграційних тестів
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: CityTransportDbDev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: your_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    # 1. Завантажуємо код з репозиторію
    - uses: actions/checkout@v4

    # 2. Встановлюємо .NET SDK (змініть версію, якщо у вас 9.0 або інша, наприклад '9.0.x')
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # 3. Відновлюємо залежності (NuGet пакети)
    - name: Restore dependencies
      run: dotnet restore

    # 4. Збираємо проєкт
    - name: Build project
      run: dotnet build --no-restore
      
    - name: Install EF Core CLI tools
      run: dotnet tool install --global dotnet-ef

    - name: Apply database migrations
      run: dotnet ef database update --project CityTransport/CityTransport.csproj
      env:
        # Рядок підключення до тестового контейнера PostgreSQL вище
        ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=CityTransportDbDev;Username=postgres;Password=your_password"

    # 5. Запускаємо юніт-тести
    - name: Run unit tests
      run: dotnet test --no-build --verbosity normal

      # 6. Генеруємо візуальний звіт та таблицю для GitHub Step Summary
    - name: Generate Coverage Report
      uses: danielpalme/ReportGenerator-GitHub-Action@5.4.1
      with:
        reports: './TestResults/**/coverage.cobertura.xml'
        targetdir: './CoverageReport'
        reporttypes: 'HtmlInline_AzurePipelines;MarkdownSummaryGithub'

    # 7. Виводимо зведення покриття прямо на сторінку запуску в GitHub Actions
    - name: Publish Coverage Summary
      run: cat ./CoverageReport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

    # 8. Зберігаємо HTML-звіт як артефакт для завантаження
    - name: Upload Coverage Report Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: code-coverage-report
        path: ./CoverageReport
